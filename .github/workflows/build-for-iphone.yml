name: Build a game for iPhone and iPad
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game
        required: true
        type: choice
        options:
          - f0x
permissions:
  contents: read
concurrency:
  group: personal-fzerox-intel
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Apple toolchain
        run: |
          uname -m
          xcodebuild -version
          python3 -c 'import subprocess; assert "Build version 17C529" in subprocess.check_output(["xcodebuild", "-version"], text=True); assert subprocess.check_output(["xcrun", "--sdk", "iphoneos", "--show-sdk-version"], text=True).strip() == "26.2"'
          xcrun --sdk iphoneos --show-sdk-path
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Build the pinned F0X iPhone app
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git clone --depth 1 --branch v0.1.2 https://github.com/chrissotraidis/f0x.git "$RUNNER_TEMP/f0x"
          git -C "$RUNNER_TEMP/f0x" rev-parse HEAD
          python3 build-support/prepare-iphone-build.py "$RUNNER_TEMP/f0x" --cache "$GITHUB_WORKSPACE/build-support/ios26_2_arm64_probes.cmake"
          F0X_BUILD_JOBS=3 bash "$RUNNER_TEMP/f0x/scripts/build-padmint-ios.sh" "$RUNNER_TEMP/out/F0X-v0.1.2-ios-personal.ipa"
      - name: Audit the device package
        run: |
          python3 -m padmint audit "$RUNNER_TEMP/out/F0X-v0.1.2-ios-personal.ipa"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 ./*.ipa | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f0x-iphone-personal
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
      - name: Keep configuration diagnostics if compilation fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f0x-build-configuration
          path: |
            ${{ runner.temp }}/f0x/build/f0x-ios-device/CMakeCache.txt
            ${{ runner.temp }}/f0x/build/f0x-ios-device/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 1
          if-no-files-found: ignore
